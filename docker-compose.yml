services:
  postgres:
    image: postgres:17
    container_name: netpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: netpulse
      POSTGRES_USER: netpulse_user
      POSTGRES_PASSWORD: netpulse_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse_user -d netpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: