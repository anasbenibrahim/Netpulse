spring.application.name=netpulse-backend

server.port=7000

# ---------------------------------------------------------------
# PostgreSQL (docker-compose.yml at the repo root)
# Each value can be overridden with an environment variable.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/netpulse}
spring.datasource.username=${DB_USERNAME:netpulse_user}
spring.datasource.password=${DB_PASSWORD:netpulse_password}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---------------------------------------------------------------
# MQTT
# ---------------------------------------------------------------
netpulse.mqtt.enabled=true
# Override with MQTT_BROKER_URL when the broker is not on this LAN address
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=netpulse-backend

mqtt.topic.telemetry=netpulse/devices/+/telemetry
mqtt.topic.network=netpulse/devices/+/network
mqtt.topic.status=netpulse/devices/+/status
mqtt.topic.command-result=netpulse/devices/+/command-result
# Commands to a device are published on netpulse/devices/{deviceCode}/command
mqtt.topic.command-prefix=netpulse/devices/

# A command with no answer from the device after this long is marked TIMED_OUT.
# A Wi-Fi switch with rollback can take ~60 s on the ESP32.
netpulse.command.timeout=120s

# ---------------------------------------------------------------
# Devices
# ---------------------------------------------------------------
# The ESP32 publishes every ~5 s; no message for this long => OFFLINE.
netpulse.device.offline-timeout=30s
netpulse.device.offline-check-interval-ms=10000

# Telemetry rows older than this are deleted every night at 03:00.
netpulse.telemetry.retention=7d

# ---------------------------------------------------------------
# Anomaly detection thresholds (starting values, calibrate during tests)
# ---------------------------------------------------------------
# Lower is worse
netpulse.anomaly.rssi.warning=-80
netpulse.anomaly.rssi.critical=-90
netpulse.anomaly.free-heap.warning=20000
netpulse.anomaly.free-heap.critical=10000
netpulse.anomaly.health-score.warning=60
netpulse.anomaly.health-score.critical=40
# Higher is worse
netpulse.anomaly.gateway-latency.warning=100
netpulse.anomaly.gateway-latency.critical=300
netpulse.anomaly.internet-latency.warning=300
netpulse.anomaly.internet-latency.critical=1000
netpulse.anomaly.packet-loss.warning=10
netpulse.anomaly.packet-loss.critical=50
# Consecutive normal readings needed before an anomaly is resolved (avoids flapping).
netpulse.anomaly.resolve-after=3

# ---------------------------------------------------------------
# CORS for the React dashboard (Vite dev server)
# ---------------------------------------------------------------
netpulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
